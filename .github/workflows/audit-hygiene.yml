name: Audit hygiene

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reject committed third-party archives and build binaries
        shell: bash
        run: |
          set -euo pipefail
          blocked='\.(zip|7z|rar|apk|aab|ipa|exe|dll|war)$'
          found="$(git ls-files | grep -Ei "$blocked" || true)"
          if [[ -n "$found" ]]; then
            echo "::error::Blocked binary/archive artifacts are committed:"
            printf '%s\n' "$found"
            exit 1
          fi
      - name: Reject oversized tracked files
        shell: bash
        run: |
          set -euo pipefail
          max_bytes=$((5 * 1024 * 1024))
          failed=0
          while IFS= read -r -d '' path; do
            size="$(wc -c < "$path")"
            if (( size > max_bytes )); then
              echo "::error file=$path::Tracked file is $size bytes; audit/product sources must stay under $max_bytes bytes."
              failed=1
            fi
          done < <(git ls-files -z)
          exit "$failed"
      - name: Enforce Phase 1 evidence-card integrity
        shell: bash
        run: |
          set -euo pipefail
          ledger='audits/PHASE1_ACCEPTANCE_LEDGER.md'
          mapfile -t cards < <(find audits/sources -maxdepth 1 -type f -name '*.md' -printf '%f\n' | sort)
          if (( ${#cards[@]} != 30 )); then
            echo "::error::Phase 1 requires exactly 30 source evidence cards; found ${#cards[@]}."
            exit 1
          fi
          failed=0
          for card_name in "${cards[@]}"; do
            card="audits/sources/$card_name"
            root="${card_name%.md}"
            if ! grep -q '^Status:' "$card"; then
              echo "::error file=$card::Missing explicit Status line."
              failed=1
            fi
            if ! grep -q '^## 4BA relevance' "$card"; then
              echo "::error file=$card::Missing 4BA relevance section."
              failed=1
            fi
            if ! grep -Eq '^## (Admission decision|Migration decision)' "$card"; then
              echo "::error file=$card::Missing admission/migration decision section."
              failed=1
            fi
            if ! grep -Fq "$root" "$ledger"; then
              echo "::error file=$ledger::Evidence card $root is not represented in the Phase 1 ledger."
              failed=1
            fi
          done
          exit "$failed"
