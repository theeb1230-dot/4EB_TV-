name: Audit hygiene

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reject committed third-party archives and build binaries
        shell: bash
        run: |
          set -euo pipefail
          blocked='\.(zip|7z|rar|apk|aab|ipa|exe|dll|war)$'
          found="$(git ls-files | grep -Ei "$blocked" || true)"
          if [[ -n "$found" ]]; then
            echo "::error::Blocked binary/archive artifacts are committed:"
            printf '%s\n' "$found"
            exit 1
          fi
      - name: Reject oversized tracked files
        shell: bash
        run: |
          set -euo pipefail
          max_bytes=$((5 * 1024 * 1024))
          failed=0
          while IFS= read -r -d '' path; do
            size="$(wc -c < "$path")"
            if (( size > max_bytes )); then
              echo "::error file=$path::Tracked file is $size bytes; audit/product sources must stay under $max_bytes bytes."
              failed=1
            fi
          done < <(git ls-files -z)
          exit "$failed"
      - name: Enforce Phase 1 evidence-card integrity
        shell: bash
        run: |
          set -euo pipefail
          ledger='audits/PHASE1_ACCEPTANCE_LEDGER.md'
          matrix='docs/SOURCE_MATRIX.md'
          mapfile -t cards < <(find audits/sources -maxdepth 1 -type f -name '*.md' -printf '%f\n' | sort)

          if (( ${#cards[@]} != 30 )); then
            echo "::error::Phase 1 requires exactly 30 source evidence cards; found ${#cards[@]}."
            exit 1
          fi

          ledger_rows="$(awk -F'|' '/^\|/ { key=$2; gsub(/^[[:space:]]+|[[:space:]]+$/, "", key); if (key != "Source" && key !~ /^-+$/) count++ } END { print count+0 }' "$ledger")"
          if (( ledger_rows != 30 )); then
            echo "::error file=$ledger::Phase 1 ledger must contain exactly 30 source rows; found $ledger_rows."
            exit 1
          fi

          matrix_rows="$(awk -F'|' '/^\|[[:space:]]*[0-9]+[[:space:]]*\|/ { count++ } END { print count+0 }' "$matrix")"
          if (( matrix_rows != 30 )); then
            echo "::error file=$matrix::SOURCE_MATRIX must contain exactly 30 numbered roots; found $matrix_rows."
            exit 1
          fi

          failed=0
          for card_name in "${cards[@]}"; do
            card="audits/sources/$card_name"
            root="${card_name%.md}"

            if ! grep -q '^Status:' "$card"; then
              echo "::error file=$card::Missing explicit Status line."
              failed=1
            fi

            if ! grep -Eq '^## 4BA (relevance|classification)' "$card"; then
              echo "::error file=$card::Missing 4BA relevance/classification section."
              failed=1
            fi

            if ! grep -Eq '^## (Admission decision|Migration decision|Admission boundary|4BA decision)' "$card"; then
              echo "::error file=$card::Missing admission/migration decision or boundary section."
              failed=1
            fi

            if ! grep -Fq "| $root |" "$matrix"; then
              echo "::error file=$matrix::Evidence-card root $root is not represented exactly in SOURCE_MATRIX."
              failed=1
            fi
          done

          exit "$failed"
