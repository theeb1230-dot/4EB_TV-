name: Core contracts

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'tools/check_architecture.py'
      - '.github/workflows/core-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'tools/check_architecture.py'
      - '.github/workflows/core-contracts.yml'

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify package dependency graph
        run: python3 tools/check_architecture.py
      - name: Presentation and Experiences must not depend on Provider SDK
        run: |
          if grep -R -n -E "provider_sdk|package:provider_sdk" packages/experience_contract packages/presentation_contract packages/flutter_presentation; then
            echo "Presentation and Experience boundaries must remain provider-blind."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [core_domain, provider_sdk, resolver_engine, metadata_engine, design_tokens, capability_kernel, experience_contract, presentation_contract, local_data_memory, local_data_codec, local_data_persistent]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Check Dart formatting
        run: |
          dart format .
          git diff --exit-code -- .
      - name: Show formatter diff on failure
        if: failure()
        run: git diff -- .
      - run: dart analyze --fatal-infos
      - run: dart test

  flutter-presentation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flutter_presentation
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check Flutter formatting
        run: |
          dart format .
          git diff --exit-code -- .
      - name: Show formatter diff on failure
        if: failure()
        run: git diff -- .
      - run: flutter analyze
      - run: flutter test
